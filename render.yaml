services:
  # Backend API Web Service
  - type: web
    name: smart-parking-backend
    env: node
    region: singapore # or oregon, frankfurt, etc.
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false

  # Optional Frontend Static Site (If deploying frontend to Render)
  - type: web
    name: smart-parking-frontend
    env: static
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_GOOGLE_MAPS_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
